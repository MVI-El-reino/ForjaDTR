<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>La Brasa & Sazón | Demo Menú Digital por Forja DTR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-page: #F4F4F6;
      --bg-white: #FFFFFF;
      --oxford: #27292E;
      --carbon: #111215;
      --forge-orange: #F97316;
      --forge-orange-hover: #EA580C;
      --steel-gray: #52525B;
      --border-light: #E4E4E7;
      --green-wa: #16A34A;
      --radius-md: 12px;
      --radius-lg: 16px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-page);
      color: var(--carbon);
      padding-bottom: 96px;
    }

    h1, h2, h3 {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* ================= BARRA DEMO FORJA DTR ================= */
    .dtr-demo-bar {
      background-color: var(--carbon);
      color: var(--bg-white);
      padding: 10px 16px;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 2px solid var(--forge-orange);
    }

    .dtr-demo-bar span {
      color: #D4D4D8;
    }

    .dtr-demo-bar strong {
      color: var(--bg-white);
    }

    .dtr-quote-btn {
      background-color: var(--forge-orange);
      color: var(--bg-white);
      text-decoration: none;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 6px;
      white-space: nowrap;
      font-size: 0.78rem;
    }

    /* ================= ENCABEZADO DEL RESTAURANTE ================= */
    .restaurant-header {
      background: linear-gradient(145deg, var(--oxford) 0%, var(--carbon) 100%);
      color: var(--bg-white);
      padding: 28px 20px 24px;
    }

    .container {
      max-width: 780px;
      margin: 0 auto;
    }

    .rest-top {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }

    .rest-avatar {
      width: 60px;
      height: 60px;
      border-radius: 14px;
      background-color: var(--forge-orange);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      flex-shrink: 0;
      box-shadow: 0 8px 18px rgba(249, 115, 22, 0.3);
    }

    .rest-info h1 {
      font-size: 1.45rem;
      margin-bottom: 4px;
    }

    .rest-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.82rem;
      color: #D4D4D8;
    }

    .status-open {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: #4ADE80;
      font-weight: 600;
    }

    .status-open::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #4ADE80;
    }

    /* Buscador */
    .search-box {
      position: relative;
      margin-top: 14px;
    }

    .search-box input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      border-radius: var(--radius-md);
      border: 1px solid #3F3F46;
      background-color: rgba(255, 255, 255, 0.08);
      color: var(--bg-white);
      font-size: 16px; /* Evita auto-zoom en iPhone Safari */
      outline: none;
    }

    .search-box input::placeholder {
      color: #A1A1AA;
    }

    .search-box svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #A1A1AA;
    }

    /* ================= CATEGORÍAS ================= */
    .categories-bar {
      background-color: var(--bg-white);
      border-bottom: 1px solid var(--border-light);
      padding: 12px 16px;
      position: sticky;
      top: 45px;
      z-index: 900;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
    }

    .categories-bar::-webkit-scrollbar {
      display: none;
    }

    .cat-list {
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      gap: 8px;
    }

    .cat-btn {
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid var(--border-light);
      background-color: var(--bg-page);
      color: var(--oxford);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .cat-btn.active {
      background-color: var(--forge-orange);
      color: var(--bg-white);
      border-color: var(--forge-orange);
    }

    /* ================= GRID DE PLATILLOS ================= */
    .menu-section {
      padding: 20px 16px;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    @media (max-width: 600px) {
      .menu-grid {
        grid-template-columns: 1fr;
      }
    }

    .item-card {
      background-color: var(--bg-white);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 16px;
      display: flex;
      justify-content: space-between;
      gap: 14px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .item-card:active {
      transform: scale(0.99);
    }

    .item-details {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
    }

    .item-badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--forge-orange);
      margin-bottom: 4px;
    }

    .item-details h3 {
      font-size: 1.02rem;
      margin-bottom: 6px;
      color: var(--carbon);
    }

    .item-details p {
      font-size: 0.84rem;
      color: var(--steel-gray);
      line-height: 1.4;
      margin-bottom: 12px;
    }

    .item-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .item-price {
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--carbon);
    }

    .add-pill {
      background-color: rgba(249, 115, 22, 0.12);
      color: var(--forge-orange);
      font-weight: 700;
      font-size: 0.82rem;
      padding: 6px 12px;
      border-radius: 8px;
    }

    .item-emoji-box {
      width: 76px;
      height: 76px;
      border-radius: 12px;
      background-color: var(--bg-page);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.3rem;
      flex-shrink: 0;
      align-self: center;
    }

    /* ================= BARRA FLOTANTE DEL CARRITO ================= */
    .floating-cart {
      position: fixed;
      bottom: 16px;
      left: 16px;
      right: 16px;
      z-index: 950;
      display: none;
    }

    .floating-cart.visible {
      display: block;
    }

    .cart-trigger {
      max-width: 780px;
      margin: 0 auto;
      width: 100%;
      background-color: var(--carbon);
      color: var(--bg-white);
      border: 2px solid var(--forge-orange);
      border-radius: 14px;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 700;
      font-size: 0.98rem;
      cursor: pointer;
      box-shadow: 0 12px 28px rgba(17, 18, 21, 0.35);
    }

    .cart-count-badge {
      background-color: var(--forge-orange);
      color: var(--bg-white);
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.85rem;
      margin-right: 8px;
    }

    /* ================= MODALES (PERSONALIZAR Y CARRITO) ================= */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(17, 18, 21, 0.65);
      z-index: 1100;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-backdrop.open {
      display: flex;
    }

    @media (min-width: 640px) {
      .modal-backdrop {
        align-items: center;
        padding: 20px;
      }
    }

    .modal-sheet {
      background-color: var(--bg-white);
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 20px 20px 0 0;
      padding: 24px 20px;
      animation: slideUp 0.22s ease;
    }

    @media (min-width: 640px) {
      .modal-sheet {
        border-radius: 20px;
      }
    }

    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-light);
    }

    .close-modal {
      background: var(--bg-page);
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      color: var(--oxford);
    }

    .option-group {
      margin-bottom: 18px;
    }

    .option-group label.group-title {
      display: block;
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 8px;
      color: var(--oxford);
    }

    .extra-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border: 1px solid var(--border-light);
      border-radius: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .extra-row input {
      accent-color: var(--forge-orange);
      width: 18px;
      height: 18px;
    }

    .form-input {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border-light);
      border-radius: 10px;
      font-family: inherit;
      font-size: 16px; /* Evita auto-zoom en iOS */
      margin-top: 4px;
    }

    .qty-control {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin: 18px 0;
    }

    .qty-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid var(--border-light);
      background-color: var(--bg-page);
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary-full {
      width: 100%;
      padding: 14px;
      background-color: var(--forge-orange);
      color: var(--bg-white);
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
    }

    .btn-wa-full {
      width: 100%;
      padding: 15px;
      background-color: var(--green-wa);
      color: var(--bg-white);
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* Lista dentro del carrito */
    .cart-item-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-light);
      gap: 10px;
    }

    .cart-item-info strong {
      display: block;
      font-size: 0.95rem;
    }

    .cart-item-info small {
      display: block;
      color: var(--steel-gray);
      font-size: 0.8rem;
    }

    .remove-item {
      color: #DC2626;
      background: none;
      border: none;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
    }

    .delivery-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    .delivery-btn {
      padding: 10px;
      border: 1px solid var(--border-light);
      border-radius: 10px;
      background: var(--bg-page);
      font-weight: 600;
      font-size: 0.86rem;
      cursor: pointer;
    }

    .delivery-btn.active {
      border-color: var(--forge-orange);
      background-color: rgba(249, 115, 22, 0.1);
      color: var(--forge-orange);
    }

    .totals-box {
      background-color: var(--bg-page);
      padding: 14px;
      border-radius: 12px;
      margin: 16px 0;
      font-size: 0.92rem;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .total-row.final {
      font-weight: 800;
      font-size: 1.1rem;
      border-top: 1px solid var(--border-light);
      padding-top: 8px;
      margin-top: 8px;
      margin-bottom: 0;
    }
  </style>
</head>
<body>

  <!-- BARRA SUPERIOR DE DEMO FORJA DTR -->
  <div class="dtr-demo-bar">
    <a href="index.html" style="color: #D4D4D8; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;">
      <span>← Volver a <strong style="color: #FFFFFF;">Forja DTR</strong></span>
    </a>
    <a href="#" id="dtrQuoteLink" class="dtr-quote-btn" target="_blank" rel="noopener noreferrer">Cotizar uno así →</a>
  </div>

  <!-- ENCABEZADO DEL NEGOCIO DEMO -->
  <header class="restaurant-header">
    <div class="container">
      <div class="rest-top">
        <div class="rest-avatar">🍔</div>
        <div class="rest-info">
          <h1>La Brasa & Sazón</h1>
          <div class="rest-meta">
            <span class="status-open">Abierto ahora</span>
            <span>• 25-35 min</span>
            <span>• Córdoba, Ver.</span>
          </div>
        </div>
      </div>

      <div class="search-box">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <input type="text" id="searchInput" placeholder="Buscar hamburguesa, tacos, bebida..." />
      </div>
    </div>
  </header>

  <!-- BARRA DE CATEGORÍAS -->
  <nav class="categories-bar">
    <div class="cat-list" id="categoryList"></div>
  </nav>

  <!-- LISTADO DE PLATILLOS -->
  <main class="menu-section">
    <div class="container">
      <div class="menu-grid" id="menuGrid"></div>
    </div>
  </main>

  <!-- BOTÓN FLOTANTE DEL CARRITO -->
  <div class="floating-cart" id="floatingCart">
    <button class="cart-trigger" id="openCartBtn">
      <span><span class="cart-count-badge" id="cartBadge">0</span> Ver mi pedido</span>
      <span id="cartFloatingTotal">$0 MXN</span>
    </button>
  </div>

  <!-- MODAL 1: PERSONALIZAR PLATILLO -->
  <div class="modal-backdrop" id="itemModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <div>
          <h3 id="modalItemTitle">Platillo</h3>
          <p id="modalItemDesc" style="font-size: 0.85rem; color: var(--steel-gray); margin-top: 4px;"></p>
        </div>
        <button class="close-modal" id="closeItemModal">✕</button>
      </div>

      <div class="option-group" id="extrasContainer">
        <label class="group-title">Agrega extras (Opcional)</label>
        <div id="extrasList"></div>
      </div>

      <div class="option-group">
        <label class="group-title" for="itemNotes">Instrucciones para cocina</label>
        <input type="text" id="itemNotes" class="form-input" placeholder="Ej. Sin cebolla, salsa aparte..." />
      </div>

      <div class="qty-control">
        <button class="qty-btn" id="qtyMinus">−</button>
        <strong id="qtyValue" style="font-size: 1.2rem;">1</strong>
        <button class="qty-btn" id="qtyPlus">+</button>
      </div>

      <button class="btn-primary-full" id="confirmAddBtn">Agregar al pedido • $0 MXN</button>
    </div>
  </div>

  <!-- MODAL 2: CARRITO Y ENVÍO A WHATSAPP -->
  <div class="modal-backdrop" id="cartModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3>Tu Pedido</h3>
        <button class="close-modal" id="closeCartModal">✕</button>
      </div>

      <div id="cartItemsList"></div>

      <div style="margin-top: 16px;">
        <label class="group-title" style="display:block; font-weight:700; font-size:0.9rem; margin-bottom:8px;">¿Cómo recibes tu pedido?</label>
        <div class="delivery-toggle">
          <button type="button" class="delivery-btn active" data-type="domicilio">🛵 A Domicilio (+$35)</button>
          <button type="button" class="delivery-btn" data-type="recoger">🏪 Recoger en Local</button>
        </div>
      </div>

      <div class="option-group">
        <label class="group-title" for="customerName">Tu Nombre</label>
        <input type="text" id="customerName" class="form-input" placeholder="Ej. Carlos Mendoza" />
      </div>

      <div class="option-group" id="addressGroup">
        <label class="group-title" for="customerAddress">Dirección de entrega y referencias</label>
        <input type="text" id="customerAddress" class="form-input" placeholder="Calle, número, colonia y referencia" />
      </div>

      <div class="option-group">
        <label class="group-title" for="paymentMethod">Método de pago</label>
        <select id="paymentMethod" class="form-input">
          <option value="Efectivo">Efectivo al recibir</option>
          <option value="Transferencia">Transferencia bancaria</option>
          <option value="Tarjeta en entrega">Terminal con tarjeta</option>
        </select>
      </div>

      <div class="totals-box">
        <div class="total-row">
          <span>Subtotal</span>
          <span id="summarySubtotal">$0 MXN</span>
        </div>
        <div class="total-row" id="shippingRow">
          <span>Costo de envío</span>
          <span>$35 MXN</span>
        </div>
        <div class="total-row final">
          <span>Total a pagar</span>
          <span id="summaryTotal">$0 MXN</span>
        </div>
      </div>

      <button class="btn-wa-full" id="sendWhatsAppBtn">
        Enviar Pedido por WhatsApp
      </button>
    </div>
  </div>

    // Cargar carrito desde localStorage con manejo seguro (Safari privado)
    let cart = [];
    try {
      cart = JSON.parse(localStorage.getItem("dtr_demo_menu_cart")) || [];
    } catch (e) {

    function saveCart() {

      updateFloatingCart();
    }

    // Renderizar categorías
    function renderCategories() {
      const categories = ["Todos", ...new Set(MENU_ITEMS.map(i => i.category))];
      const catList = document.getElementById("categoryList");
      catList.innerHTML = categories.map(cat => `
        <button class="cat-btn ${cat === activeCategory ? 'active' : ''}" onclick="setCategory('${cat}')">
          ${cat}
        </button>
      `).join("");
    }

    window.setCategory = function(cat) {
      activeCategory = cat;
      renderCategories();
      renderMenu();
    };

    // Renderizar platillos
    function renderMenu() {
      const grid = document.getElementById("menuGrid");
      const filtered = MENU_ITEMS.filter(item => {
        const matchCat = activeCategory === "Todos" || item.category === activeCategory;
        const matchText = item.name.toLowerCase().includes(searchQuery) || item.desc.toLowerCase().includes(searchQuery);
        return matchCat && matchText;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<p style="color: var(--steel-gray); grid-column: 1/-1; text-align:center; padding: 32px 0;">No encontramos platillos con esa búsqueda.</p>`;
        return;
      }

      grid.innerHTML = filtered.map(item => `
        <article class="item-card" onclick="openItemModal(${item.id})">
          <div class="item-details">
            <div>
              ${item.badge ? `<span class="item-badge">${item.badge}</span>` : ""}
              <h3>${item.name}</h3>
              <p>${item.desc}</p>
            </div>
            <div class="item-bottom">
              <span class="item-price">$${item.price} MXN</span>
              <span class="add-pill">+ Agregar</span>
            </div>
          </div>
          <div class="item-emoji-box">${item.emoji}</div>
        </article>
      `).join("");
    }

    document.getElementById("searchInput").addEventListener("input", (e) => {
      searchQuery = e.target.value.toLowerCase().trim();
      renderMenu();
    });

    // Modal de platillo
    window.openItemModal = function(id) {
      selectedItem = MENU_ITEMS.find(i => i.id === id);
      currentQty = 1;
      document.getElementById("modalItemTitle").textContent = selectedItem.name;
      document.getElementById("modalItemDesc").textContent = selectedItem.desc;
      document.getElementById("itemNotes").value = "";
      document.getElementById("qtyValue").textContent = currentQty;

      const extrasContainer = document.getElementById("extrasContainer");
      const extrasList = document.getElementById("extrasList");

      if (selectedItem.extras && selectedItem.extras.length > 0) {
        extrasContainer.style.display = "block";
        extrasList.innerHTML = selectedItem.extras.map((ex, idx) => `
          <label class="extra-row">
            <span>${ex.name} (+$${ex.price})</span>
            <input type="checkbox" value="${idx}" onchange="updateModalPrice()" />
          </label>
        `).join("");
      } else {
        extrasContainer.style.display = "none";
        extrasList.innerHTML = "";
      }

      updateModalPrice();
      document.getElementById("itemModal").classList.add("open");
    };

    function getSelectedExtras() {
      const checked = document.querySelectorAll("#extrasList input:checked");
      return Array.from(checked).map(cb => selectedItem.extras[parseInt(cb.value)]);
    }

    window.updateModalPrice = function() {
      const extrasTotal = getSelectedExtras().reduce((sum, ex) => sum + ex.price, 0);
      const total = (selectedItem.price + extrasTotal) * currentQty;
      document.getElementById("confirmAddBtn").textContent = `Agregar al pedido • $${total} MXN`;
    };

    document.getElementById("qtyMinus").addEventListener("click", () => {
      if (currentQty > 1) {
        currentQty--;
        document.getElementById("qtyValue").textContent = currentQty;
        updateModalPrice();
      }
    });

    document.getElementById("qtyPlus").addEventListener("click", () => {
      currentQty++;
      document.getElementById("qtyValue").textContent = currentQty;
      updateModalPrice();
    });

    document.getElementById("closeItemModal").addEventListener("click", () => {
      document.getElementById("itemModal").classList.remove("open");
    });

    document.getElementById("confirmAddBtn").addEventListener("click", () => {
      const extras = getSelectedExtras();
      const extrasTotal = extras.reduce((sum, ex) => sum + ex.price, 0);
      const unitPrice = selectedItem.price + extrasTotal;

      cart.push({
        uid: Date.now(),
        name: selectedItem.name,
        qty: currentQty,
        unitPrice,
        totalPrice: unitPrice * currentQty,
        extras: extras.map(e => e.name),
        notes: document.getElementById("itemNotes").value.trim()
      });

      saveCart();
      document.getElementById("itemModal").classList.remove("open");
    });

    // Carrito flotante y Modal de Checkout
    function updateFloatingCart() {
      const floatingCart = document.getElementById("floatingCart");
      const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
      const subtotal = cart.reduce((sum, item) => sum + item.totalPrice, 0);

      if (totalItems > 0) {
        floatingCart.classList.add("visible");
        document.getElementById("cartBadge").textContent = totalItems;
        document.getElementById("cartFloatingTotal").textContent = `$${subtotal} MXN`;
      } else {
        floatingCart.classList.remove("visible");
      }
    }

    document.getElementById("openCartBtn").addEventListener("click", () => {
      renderCartModal();
      document.getElementById("cartModal").classList.add("open");
    });

    document.getElementById("closeCartModal").addEventListener("click", () => {
      document.getElementById("cartModal").classList.remove("open");
    });

    function renderCartModal() {
      const list = document.getElementById("cartItemsList");
      if (cart.length === 0) {
        list.innerHTML = `<p style="color: var(--steel-gray); text-align:center; padding: 20px 0;">Tu carrito está vacío.</p>`;
      } else {
        list.innerHTML = cart.map(item => `
          <div class="cart-item-row">
            <div class="cart-item-info">
              <strong>${item.qty}x ${item.name}</strong>
              ${item.extras.length ? `<small>Extras: ${item.extras.join(", ")}</small>` : ""}
              ${item.notes ? `<small>Nota: "${item.notes}"</small>` : ""}
              <button class="remove-item" onclick="removeCartItem(${item.uid})">Eliminar</button>
            </div>
            <strong>$${item.totalPrice} MXN</strong>
          </div>
        `).join("");
      }
      updateTotals();
    }

    window.removeCartItem = function(uid) {
      cart = cart.filter(i => i.uid !== uid);
      saveCart();
      if (cart.length === 0) {
        document.getElementById("cartModal").classList.remove("open");
      } else {
        renderCartModal();
      }
    };

    document.querySelectorAll(".delivery-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".delivery-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        deliveryType = btn.dataset.type;
        document.getElementById("addressGroup").style.display = deliveryType === "domicilio" ? "block" : "none";
        document.getElementById("shippingRow").style.display = deliveryType === "domicilio" ? "flex" : "none";
        updateTotals();
      });
    });

    function updateTotals() {
      const subtotal = cart.reduce((sum, item) => sum + item.totalPrice, 0);
      const shipping = (deliveryType === "domicilio" && subtotal > 0) ? SHIPPING_COST : 0;
      const total = subtotal + shipping;

      document.getElementById("summarySubtotal").textContent = `$${subtotal} MXN`;
      document.getElementById("summaryTotal").textContent = `$${total} MXN`;
    }

    // Generar mensaje formateado a WhatsApp
    document.getElementById("sendWhatsAppBtn").addEventListener("click", () => {
      if (cart.length === 0) return;

      const name = document.getElementById("customerName").value.trim() || "Cliente Demo";
      const address = document.getElementById("customerAddress").value.trim() || "Por confirmar";
      const payment = document.getElementById("paymentMethod").value;

      const subtotal = cart.reduce((sum, item) => sum + item.totalPrice, 0);
      const shipping = deliveryType === "domicilio" ? SHIPPING_COST : 0;
      const total = subtotal + shipping;

      let msg = `*NUEVO PEDIDO — LA BRASA & SAZÓN*\n`;
      msg += `_(Demo Menú Digital por Forja DTR)_\n\n`;
      msg += `*Cliente:* ${name}\n`;
      msg += `*Modalidad:* ${deliveryType === "domicilio" ? "🛵 Envío a domicilio" : "🏪 Recoger en sucursal"}\n`;
      if (deliveryType === "domicilio") {
        msg += `*Dirección:* ${address}\n`;
      }
      msg += `*Pago:* ${payment}\n\n`;
      msg += `*DETALLE DEL PEDIDO:*\n`;

      cart.forEach(item => {
        msg += `• ${item.qty}x ${item.name} — $${item.totalPrice} MXN\n`;
        if (item.extras.length) msg += `   _Extras: ${item.extras.join(", ")}_\n`;
        if (item.notes) msg += `   _Nota: ${item.notes}_\n`;
      });

      msg += `\n*Subtotal:* $${subtotal} MXN\n`;
      if (shipping > 0) msg += `*Envío:* $${shipping} MXN\n`;
      msg += `*TOTAL A PAGAR: $${total} MXN*`;

      const url = `https://wa.me/${TU_WHATSAPP}?text=${encodeURIComponent(msg)}`;
      window.open(url, "_blank", "noopener,noreferrer");
    });

    // Inicializar
    renderCategories();
    renderMenu();
    updateFloatingCart();
  </script>
</body>
</html>
